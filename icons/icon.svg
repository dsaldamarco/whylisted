<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- A poster (Letterboxd's three dots, stacked vertically) with its corner cut out for a note badge. -->
  <defs>
    <mask id="cut">
      <rect width="96" height="96" fill="#fff"/>
      <circle cx="70" cy="22" r="22" fill="#000"/>
    </mask>
    <clipPath id="dot-orange"><circle cx="42" cy="35" r="8.5"/></clipPath>
    <clipPath id="dot-blue"><circle cx="42" cy="63" r="8.5"/></clipPath>
  </defs>

  <g mask="url(#cut)">
    <rect x="18" y="8" width="56" height="80" rx="6" fill="#2c3440"/>
    <rect x="19" y="9" width="54" height="78" rx="5" fill="none" stroke="#456" stroke-width="2"/>
  </g>

  <!-- The dots overlap slightly; the overlaps are lighter, as in the original mark. -->
  <circle cx="42" cy="35" r="8.5" fill="#ff8000"/>
  <circle cx="42" cy="63" r="8.5" fill="#40bcf4"/>
  <circle cx="42" cy="49" r="8.5" fill="#00e054"/>
  <circle cx="42" cy="49" r="8.5" fill="#ffef54" clip-path="url(#dot-orange)"/>
  <circle cx="42" cy="49" r="8.5" fill="#40f7f8" clip-path="url(#dot-blue)"/>

  <!-- The note badge. -->
  <circle cx="70" cy="22" r="17" fill="#40bcf4"/>
  <path d="M62 16h16M62 22h16M62 28h10" stroke="#14181c" stroke-width="3.5" stroke-linecap="round" fill="none"/>
</svg>
